<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AI Platform Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2c;
            --primary-neon: #a855f7;
            --secondary-neon: #06b6d4;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-glow: rgba(168, 85, 247, 0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 15px; padding-bottom: 90px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: linear-gradient(135deg, rgba(168, 85, 247, 0.15), rgba(6, 182, 212, 0.15)); padding: 12px 16px; border-radius: 16px; border: 1px solid var(--border-glow); margin-bottom: 20px; }
        .user-badge { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(45deg, var(--primary-neon), var(--secondary-neon)); display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff; }
        .credit-badge { background: rgba(168, 85, 247, 0.2); border: 1px solid var(--primary-neon); padding: 6px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; color: #e9d5ff; display: flex; align-items: center; gap: 6px; }
        .tabs { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 20px; padding-bottom: 5px; }
        .tab-btn { background: var(--card-bg); color: var(--text-muted); border: 1px solid rgba(255, 255, 255, 0.05); padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .tab-btn.active { background: linear-gradient(135deg, var(--primary-neon), #7c3aed); color: #fff; border-color: transparent; box-shadow: 0 0 12px rgba(168, 85, 247, 0.4); }
        .section { display: none; }
        .section.active { display: block; }
        .upload-card { background: var(--card-bg); border: 2px dashed rgba(168, 85, 247, 0.4); border-radius: 18px; padding: 30px 20px; text-align: center; cursor: pointer; margin-bottom: 20px; }
        .upload-icon { font-size: 36px; color: var(--primary-neon); margin-bottom: 10px; }
        .option-group { background: var(--card-bg); border-radius: 16px; padding: 16px; margin-bottom: 20px; border: 1px solid rgba(255, 255, 255, 0.05); }
        .option-title { font-size: 14px; color: var(--text-muted); margin-bottom: 12px; display: flex; justify-content: space-between; }
        .duration-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .dur-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 12px 8px; text-align: center; cursor: pointer; }
        .dur-card.selected { background: rgba(168, 85, 247, 0.2); border-color: var(--primary-neon); box-shadow: 0 0 8px rgba(168, 85, 247, 0.3); }
        .dur-time { font-weight: bold; font-size: 15px; color: var(--text-main); }
        .dur-cost { font-size: 11px; color: var(--secondary-neon); margin-top: 4px; }
        .action-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(11, 15, 25, 0.9); backdrop-filter: blur(10px); padding: 15px 20px; border-top: 1px solid rgba(255, 255, 255, 0.1); }
        .btn-generate { width: 100%; background: linear-gradient(135deg, var(--primary-neon), var(--secondary-neon)); color: #fff; border: none; padding: 14px; border-radius: 14px; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="user-badge">
            <div class="avatar" id="user-avatar">U</div>
            <div>
                <div style="font-weight: bold; font-size: 14px;" id="user-name">مستخدم البوت</div>
                <div style="font-size: 11px; color: var(--text-muted);" id="user-id">ID: ---</div>
            </div>
        </div>
        <div class="credit-badge">
            <i class="fa-solid fa-coins"></i>
            <span id="user-credits">70 رصيد</span>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tab-video')"><i class="fa-solid fa-video"></i> توليد فيديو</button>
        <button class="tab-btn" onclick="switchTab('tab-faceswap')"><i class="fa-solid fa-masks-theater"></i> تبديل الوجوه</button>
    </div>

    <div id="tab-video" class="section active">
        <div class="upload-card">
            <i class="fa-solid fa-cloud-arrow-up upload-icon"></i>
            <div style="font-weight: bold; font-size: 15px; margin-bottom: 4px;">اضغط هنا لرفع الصورة Target</div>
            <div style="font-size: 12px; color: var(--text-muted);">يدعم JPG, PNG بجودة عالية</div>
        </div>
        <div class="option-group">
            <div class="option-title"><span>اختر مدة الفيديو</span><span style="color: var(--secondary-neon);">1 ثانية = 1 رصيد</span></div>
            <div class="duration-grid">
                <div class="dur-card selected" onclick="selectDuration(this, 10)"><div class="dur-time">10 ثوانٍ</div><div class="dur-cost">10 رصيد</div></div>
                <div class="dur-card" onclick="selectDuration(this, 15)"><div class="dur-time">15 ثانية</div><div class="dur-cost">15 رصيد</div></div>
                <div class="dur-card" onclick="selectDuration(this, 30)"><div class="dur-time">30 ثانية 👑</div><div class="dur-cost">30 رصيد (VIP)</div></div>
            </div>
        </div>
    </div>

    <div id="tab-faceswap" class="section">
        <div class="upload-card">
            <i class="fa-solid fa-user-gear upload-icon"></i>
            <div style="font-weight: bold; font-size: 15px;">ارفع الصورة الأصلية + الهدف</div>
            <div style="font-size: 12px; color: var(--text-muted);">تبديل وجوه دقيق جداً (2 رصيد)</div>
        </div>
    </div>

    <div class="action-bar">
        <button class="btn-generate" onclick="sendOrderToBot()">
            <i class="fa-solid fa-bolt"></i>
            <span>بدء التوليد الآن (<span id="total-cost">10</span> رصيد)</span>
        </button>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.expand();
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                const user = tg.initDataUnsafe.user;
                document.getElementById('user-name').innerText = user.first_name;
                document.getElementById('user-id').innerText = 'ID: ' + user.id;
                document.getElementById('user-avatar').innerText = user.first_name.charAt(0).toUpperCase();
            }
        }
        let selectedCredits = 10;
        function switchTab(tabId) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }
        function selectDuration(element, seconds) {
            document.querySelectorAll('.dur-card').forEach(c => c.classList.remove('selected'));
            element.classList.add('selected');
            selectedCredits = seconds;
            document.getElementById('total-cost').innerText = selectedCredits;
        }
        function sendOrderToBot() {
            if (tg) {
                tg.sendData(JSON.stringify({ action: "generate_video", cost: selectedCredits }));
                tg.close();
            }
        }
    </script>
</body>
</html>
